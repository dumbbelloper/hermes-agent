[metadata]
name = hermes-news-automation
version = 0.1.0
description = Official-source-first payment ecosystem collector
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
package_dir =
    = skills/hermes-news-automation/scripts/runtime
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = skills/hermes-news-automation/scripts/runtime

[options.package_data]
hermes_agent =
    default_sources.json

[options.entry_points]
console_scripts =
    hermes-news = hermes_agent.cli:main
