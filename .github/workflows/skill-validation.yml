name: Skill validation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "skills/**"
      - "Automation/config/sources.json"
      - "Automation/tests/**"
      - "pyproject.toml"
      - "setup.cfg"
      - "skills.sh.json"
      - ".github/workflows/skill-validation.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "skills/**"
      - "Automation/config/sources.json"
      - "Automation/tests/**"
      - "pyproject.toml"
      - "setup.cfg"
      - "skills.sh.json"
      - ".github/workflows/skill-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package from bundled Skill runtime
        run: python -m pip install --no-deps .
      - name: Run offline tests
        run: python -m unittest discover -s Automation/tests -v
      - name: Compile bundled runtime
        run: python -m compileall -q skills/hermes-news-automation/scripts
