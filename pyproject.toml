[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent"
version = "0.1.0"
description = "Official-source-first payment ecosystem collector"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Hermes Agent contributors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.scripts]
hermes-collector = "hermes_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "Automation/src" }

[tool.setuptools.packages.find]
where = ["Automation/src"]

[tool.setuptools.package-data]
hermes_agent = ["default_sources.json"]
